<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>لوحة SPARKODERS</title>
    <script>
      // Light/dark preference before first paint (dark by default, like the brand).
      try {
        if (localStorage.getItem('appearance') === 'light') document.documentElement.classList.remove('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
